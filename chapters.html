 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chapters | Chaotic World: Raid Of Sins</title>

    <meta name="description" content="Read Chaotic World: Raid Of Sins, beginning with the Prologue and continuing through the chapters.">

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header>

        <nav>

            <a href="index.html" class="logo">
                CHAOTIC WORLD
            </a>


            <div class="nav-links">

                <a href="index.html">Home</a>

                <a href="story.html">Story</a>

                <a href="chapters.html">Chapters</a>

                <a href="characters.html">Characters</a>

                <a href="world.html">World</a>

                <a href="gallery.html">Gallery</a>

                <a href="about.html">About</a>

            </div>

        </nav>

    </header>


    <main>


        <section class="page-hero">

            <span class="eyebrow">
                THE MEMORIES
            </span>


            <h1>
    Chapters
</h1>

<div class="volume-label">
    VOLUME ONE
    <span>—</span>
    IGNITE THE FLAME
</div>

<div class="volume-quote">
    JUDGEMENT IS YET TO COME.
</div>

<p>
    Enter the world of
    <em>Chaotic World: Raid Of Sins</em>.

    The story begins here.
</p>
        </section>



        <section class="chapters-section" id="chapters-list">

            <p>
                Loading chapters...
            </p>

        </section>


    </main>



    <footer>

        <p>
            © 2026 Chaotic World: Raid Of Sins
        </p>

    </footer>



    <script>

        fetch("data/chapters.json?v=2")

            .then(response => response.json())

            .then(data => {


                const list =
                    document.getElementById("chapters-list");


                list.innerHTML = "";


                data.chapters.forEach(chapter => {


                    const card =
                        document.createElement("div");


                    card.className =
    chapter.status === "published"
    ? "chapter-card"
    : "chapter-card coming-soon";
                    const number =
                        document.createElement("span");


                    number.className =
                        "chapter-number";


                    number.textContent =
                        chapter.number;



                    const content =
                        document.createElement("div");



                    const status =
                        document.createElement("span");


                    status.className =
                        "chapter-status";


                    status.textContent =
                        chapter.type === "prologue"

                        ? "PROLOGUE"

                        : "CHAPTER " + chapter.number;



                    const title =
                        document.createElement("h2");


                    title.textContent =
                        chapter.title;



                    const description =
                        document.createElement("p");


                    description.textContent =
                        chapter.description ||
                        "The story continues...";



                     const link =
    document.createElement("a");


if (chapter.status === "published") {

    link.href =
        "reader.html?chapter=" +
        encodeURIComponent(chapter.id);

    link.textContent =
        chapter.type === "prologue"
        ? "Read Prologue →"
        : "Read Chapter →";

} else {

    link.href = "#";

    link.textContent = "Coming Soon";

    link.addEventListener("click", function(event) {
        event.preventDefault();
    });

}        


                    content.appendChild(status);

                    content.appendChild(title);

                    content.appendChild(description);

                    content.appendChild(link);



                    card.appendChild(number);

                    card.appendChild(content);



                    list.appendChild(card);

                });

            })


            .catch(error => {


                console.error(error);


                document.getElementById("chapters-list").innerHTML =

                    "<p>Unable to load chapters.</p>";

            });

    </script>


</body>

        </html>
